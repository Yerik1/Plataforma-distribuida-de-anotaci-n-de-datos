name: proyecto2

x-mongo: &mongo
  image: mongo:7.0
  command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
  networks: [interna]
  restart: unless-stopped
  healthcheck:
    test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
    interval: 5s
    timeout: 5s
    retries: 20

services:
  mongo1:
    <<: *mongo
    hostname: mongo1
    volumes: [mongo1-datos:/data/db]

  mongo2:
    <<: *mongo
    hostname: mongo2
    volumes: [mongo2-datos:/data/db]

  mongo3:
    <<: *mongo
    hostname: mongo3
    volumes: [mongo3-datos:/data/db]

  mongo-init:
    image: mongo:7.0
    entrypoint: ["mongosh", "--host", "mongo1:27017", "--quiet", "/init-replica.js"]
    volumes: [./infra/mongo/init-replica.js:/init-replica.js:ro]
    networks: [interna]
    restart: "no"
    depends_on:
      mongo1: {condition: service_healthy}
      mongo2: {condition: service_healthy}
      mongo3: {condition: service_healthy}

  valkey:
    image: valkey/valkey:8.0
    command: ["valkey-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes: [valkey-datos:/data]
    networks: [interna]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  registro:
    build: ./servicios/registro
    environment:
      MONGO_URI: mongodb://mongo1:27017,mongo2:27017,mongo3:27017/?replicaSet=rs0
      MONGO_W: ${MONGO_W:-majority}
      LOCK_MS: ${LOCK_MS:-120000}
    networks: [interna]
    restart: unless-stopped
    depends_on:
      mongo-init: {condition: service_completed_successfully}

  sesion:
    build: ./servicios/sesion
    environment:
      VALKEY_HOST: valkey
      LOCK_MS: ${LOCK_MS:-120000}
    networks: [interna]
    restart: unless-stopped
    depends_on:
      valkey: {condition: service_healthy}

  gateway:
    build: ./servicios/gateway
    ports: ["8000:8000"]
    environment:
      REGISTRO_URL: http://registro:8000
      SESION_URL: http://sesion:8000
      VALKEY_HOST: valkey
      CAPAS: registro,sesion
      CAPAS_CRITICAS: registro,sesion
    networks: [publica, interna]
    restart: unless-stopped
    depends_on: [registro, sesion]

  generador-catalogo:
    build: ./dataset
    profiles: [datos]
    entrypoint:
      - python
      - generador_catalogo.py
      - --mongo-uri
      - mongodb://mongo1:27017,mongo2:27017,mongo3:27017/?replicaSet=rs0
      - --salida
      - /dataset/salida
      - --evidencia
      - /evidence
    volumes:
      - ./dataset/salida:/dataset/salida
      - ./evidence:/evidence
    networks: [interna]
    depends_on:
      mongo-init: {condition: service_completed_successfully}

  spark-master:
    image: spark:3.5.9-java17-python3
    profiles: [analitica]
    hostname: spark-master
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master", "--host", "spark-master"]
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:4040:4040"
    environment:
      PYSPARK_PYTHON: python3
    volumes:
      - ./servicios/analitica/spark:/opt/analitica
      - ./datalake:/opt/datalake:ro
      - ./evidence:/opt/evidence
    networks: [interna, administracion]

  spark-worker-1:
    image: spark:3.5.9-java17-python3
    profiles: [analitica]
    hostname: spark-worker-1
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077",
              "--cores", "${SPARK_WORKER_CORES:-2}", "--memory", "${SPARK_WORKER_MEMORY:-2g}"]
    cpus: ${SPARK_WORKER_CORES:-2}
    mem_limit: ${SPARK_WORKER_LIMITE:-3g}
    environment:
      PYSPARK_PYTHON: python3
    volumes:
      - ./servicios/analitica/spark:/opt/analitica
      - ./datalake:/opt/datalake:ro
    networks: [interna]
    depends_on: [spark-master]

  spark-worker-2:
    image: spark:3.5.9-java17-python3
    profiles: [spark2]
    hostname: spark-worker-2
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077",
              "--cores", "${SPARK_WORKER_CORES:-2}", "--memory", "${SPARK_WORKER_MEMORY:-2g}"]
    cpus: ${SPARK_WORKER_CORES:-2}
    mem_limit: ${SPARK_WORKER_LIMITE:-3g}
    environment:
      PYSPARK_PYTHON: python3
    volumes:
      - ./servicios/analitica/spark:/opt/analitica
      - ./datalake:/opt/datalake:ro
    networks: [interna]
    depends_on: [spark-master]

networks:
  publica: {}
  interna:
    internal: true
  administracion: {}

volumes:
  mongo1-datos:
  mongo2-datos:
  mongo3-datos:
  valkey-datos: